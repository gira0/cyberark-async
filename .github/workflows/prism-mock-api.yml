name: Mock API tests

'on':
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  contract-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install Prism
        run: |
          mkdir -p /tmp/prism
          cp package.json package-lock.json /tmp/prism/
          npm ci --ignore-scripts --prefix /tmp/prism

      - name: Install uv
        uses: astral-sh/setup-uv@557e51de59eb14aaaba2ed9621916900a91d50c6 # v6.6.1
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Start Prism
        run: |
          /tmp/prism/node_modules/.bin/prism mock tests/test_data/cyberark-pvwa-swagger.json \
            --host 127.0.0.1 --port 4010 > prism.log 2>&1 &
          echo $! > prism.pid
          curl --fail --silent --show-error --retry 30 --retry-all-errors \
            --retry-delay 1 http://127.0.0.1:4010/api/LoginsInfo > /dev/null \
            || { cat prism.log; exit 1; }

      - name: Run Prism contract test
        env:
          AIOBASTION_PRISM_URL: http://127.0.0.1:4010
        run: uv run --locked --group test pytest tests/test_prism_contract.py -q

      - name: Run API support report
        run: |
          uv run --locked --group test pytest tests/test_api_support_report.py -q -s \
            | tee api-support-report.md
          {
            echo "## CyberArk PVWA API support"
            cat api-support-report.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment API support on same-repository PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          {
            echo "## CyberArk PVWA API support"
            cat api-support-report.md
            echo "<!-- aiobastion-api-support-report -->"
          } > api-support-comment.md
          gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
            --jq '.[] | select(.body | contains("aiobastion-api-support-report")) | .id' \
            | while read -r comment_id; do
                gh api --method PATCH \
                  "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" \
                  -f body="$(cat api-support-comment.md)"
              done
          if ! gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
            --jq '.[] | select(.body | contains("aiobastion-api-support-report")) | .id' \
            | grep -q .; then
            gh pr comment "$PR_NUMBER" --body-file api-support-comment.md
          fi

      - name: Stop Prism
        if: always()
        run: test ! -f prism.pid || kill "$(cat prism.pid)" || true
