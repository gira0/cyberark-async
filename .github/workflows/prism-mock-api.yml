name: Mock API tests

'on':
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install Prism
        run: |
          mkdir -p /tmp/prism
          cp package.json package-lock.json /tmp/prism/
          npm ci --ignore-scripts --prefix /tmp/prism

      - name: Install uv
        uses: astral-sh/setup-uv@557e51de59eb14aaaba2ed9621916900a91d50c6 # v6.6.1
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Start Prism
        run: |
          /tmp/prism/node_modules/.bin/prism mock tests/test_data/cyberark-pvwa-swagger.json \
            --host 127.0.0.1 --port 4010 > prism.log 2>&1 &
          echo $! > prism.pid
          curl --fail --silent --show-error --retry 30 --retry-all-errors \
            --retry-delay 1 http://127.0.0.1:4010/api/LoginsInfo > /dev/null \
            || { cat prism.log; exit 1; }

      - name: Run Prism contract test
        env:
          AIOBASTION_PRISM_URL: http://127.0.0.1:4010
        run: uv run --locked --group test pytest tests/test_prism_contract.py -q

      - name: Stop Prism
        if: always()
        run: test ! -f prism.pid || kill "$(cat prism.pid)" || true
